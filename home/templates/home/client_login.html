{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="bg-noise"></div>

    <div class="container advance-section">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="glow-card fade-up">
                    <div class="card-content" style="padding: 3rem; text-align: center;">
                        <h2 class="mb-2">Client Login</h2>
                        <p class="text-muted mb-5">Welcome back. Please log in to continue.</p>
                        
                        {% if messages %}
                            {% for message in messages %}
                                <div style="background: rgba(220, 38, 38, 0.1); border: 1px solid rgba(220, 38, 38, 0.3); color: #fca5a5; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; text-align: left; font-size: 0.9rem;">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST" style="text-align: left;">
                            {% csrf_token %}
                            <div style="margin-bottom: 1.5rem;">
                                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem;">Email Address</label>
                                <div class="input-group-advance">
                                    <i class="fa-regular fa-envelope"></i>
                                    {{ form.username }}
                                </div>
                            </div>
                            <div style="margin-bottom: 2.5rem;">
                                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem;">Password</label>
                                <div class="input-group-advance">
                                    <i class="fa-solid fa-lock"></i>
                                    {{ form.password }}
                                </div>
                            </div>
                            <button type="submit" class="btn-neon"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
                        </form>
                        
                        <div style="margin-top: 2rem;">
                            <p class="text-muted" style="font-size: 0.9rem;">Don't have an account? <a href="{% url 'client_register' %}" style="color: var(--accent-cyan); text-decoration: none;">Register here</a></p>
                            <a href="{% url 'index' %}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: color 0.3s;"><i class="fa-solid fa-arrow-left"></i> Return to Site</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
